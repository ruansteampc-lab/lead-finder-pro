<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lead Finder Pro — Encontre + Clientes</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-darkest: #010611;
      --bg-sidebar: #020916;
      --bg-card: #041026;
      --bg-badge-open: rgba(0, 221, 181, 0.12);
      --text-badge-open: #00ddb5;
      --bg-badge-nosite: #0e2246;
      --text-badge-nosite: #8ea8cf;
      --bg-pill-price: #0a1f4d;
      --btn-blue: #1767FF;
      --btn-blue-hover: #1f72ff;
      --border-subtle: #0f2752;
      --text-light: #e6f0ff;
      --text-dim: #7e9ac3;
      --yellow-star: #ffc928;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--bg-darkest);
      color: var(--text-light);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Tela de Autenticação / Login Google */
    #authOverlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 20%, #0d2861 0%, #010611 70%);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .auth-box {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    }

    .auth-logo {
      width: 56px;
      height: 56px;
      background: rgba(23, 103, 255, 0.15);
      border: 1px solid var(--btn-blue);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
    }

    .auth-box h2 {
      font-size: 24px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 8px;
    }

    .auth-box p {
      font-size: 13px;
      color: var(--text-dim);
      margin-bottom: 28px;
      line-height: 1.5;
    }

    .btn-google {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      background: #fff;
      color: #1a1a1a;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s, background 0.15s;
    }

    .btn-google:hover {
      background: #f1f1f1;
      transform: translateY(-2px);
    }

    /* Layout do Painel */
    .app-layout {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 270px;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      padding: 24px 18px;
      gap: 20px;
      flex-shrink: 0;
    }

    .brand-header {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-info h2 {
      font-size: 18px;
      font-weight: 800;
      color: #fff;
    }

    .brand-info span {
      font-size: 11px;
      color: var(--btn-blue);
      font-weight: 600;
    }

    .nav-links {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .nav-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      background: transparent;
      border: none;
      color: var(--text-dim);
      font-size: 13.5px;
      font-weight: 600;
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s;
    }

    .nav-btn:hover {
      color: #fff;
      background-color: rgba(23, 103, 255, 0.08);
    }

    .nav-btn.active {
      background-color: #0c2b69;
      color: #fff;
    }

    .filters-panel {
      border-top: 1px solid var(--border-subtle);
      padding-top: 18px;
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    .filters-header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
      color: #fff;
    }

    .input-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-field label {
      font-size: 11.5px;
      color: var(--text-dim);
      font-weight: 600;
    }

    .input-field input, .input-field select {
      background-color: #020b1c;
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      color: #fff;
      padding: 9px 12px;
      font-size: 13px;
      outline: none;
    }

    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12.5px;
    }

    .switch {
      position: relative;
      width: 34px;
      height: 20px;
    }

    .switch input { opacity: 0; width: 0; height: 0; }
    .track {
      position: absolute;
      inset: 0;
      background-color: #0d2347;
      border-radius: 20px;
      cursor: pointer;
      transition: 0.2s;
    }

    .track:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      border-radius: 50%;
      transition: 0.2s;
    }

    input:checked + .track { background-color: var(--btn-blue); }
    input:checked + .track:before { transform: translateX(14px); }

    .btn-search-glow {
      background-color: var(--btn-blue);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 18px rgba(23, 103, 255, 0.4);
      transition: background 0.15s;
    }

    .btn-search-glow:hover { background-color: var(--btn-blue-hover); }

    .user-footer {
      margin-top: auto;
      border-top: 1px solid var(--border-subtle);
      padding-top: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .user-pill {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .user-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid var(--btn-blue);
    }

    .user-name {
      font-size: 12px;
      font-weight: 600;
      color: #fff;
      max-width: 120px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn-logout {
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 18px;
    }

    .btn-logout:hover { color: #ff5e57; }

    /* Área Central */
    .content-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .navbar-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 32px;
      border-bottom: 1px solid var(--border-subtle);
      background: rgba(2, 9, 22, 0.7);
      backdrop-filter: blur(8px);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .search-input-pill {
      display: flex;
      align-items: center;
      background-color: #030d22;
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 6px 10px 6px 18px;
      width: 580px;
      gap: 12px;
    }

    .search-input-pill input {
      background: transparent;
      border: none;
      color: #fff;
      flex: 1;
      outline: none;
      font-size: 14px;
    }

    .btn-top-submit {
      background-color: var(--btn-blue);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 9px 22px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .badge-leads-count {
      background-color: #030d22;
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 9px 16px;
      font-size: 13px;
      color: var(--text-dim);
    }

    .badge-leads-count strong { color: #fff; }

    .main-body { padding: 24px 32px; }

    .results-meta-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .count-display {
      font-size: 14px;
      color: #fff;
      font-weight: 700;
    }

    .sort-dropdown {
      background-color: #030d22;
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 6px 12px;
      color: var(--text-dim);
      font-size: 13px;
    }

    .sort-dropdown select {
      background: transparent;
      border: none;
      color: #fff;
      outline: none;
      cursor: pointer;
    }

    /* Cards */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 18px;
    }

    .lead-card-box {
      background-color: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, border-color 0.2s;
    }

    .lead-card-box:hover {
      border-color: #1a4387;
      transform: translateY(-3px);
    }

    .card-top-banner {
      height: 105px;
      background: linear-gradient(180deg, #184cc8 0%, #0d2f83 100%);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-fav-btn {
      position: absolute;
      top: 12px;
      right: 14px;
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
      opacity: 0.8;
    }

    .card-fav-btn.active svg { fill: #ff4757; stroke: #ff4757; }

    .card-inner {
      padding: 14px 16px 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .card-business-name {
      font-size: 14.5px;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-location-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-dim);
    }

    .badges-row {
      display: flex;
      gap: 6px;
      margin: 2px 0;
    }

    .pill-open {
      background-color: var(--bg-badge-open);
      color: var(--text-badge-open);
      font-size: 11px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 20px;
    }

    .pill-nosite {
      background-color: var(--bg-badge-nosite);
      color: var(--text-badge-nosite);
      font-size: 11px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 20px;
    }

    .rating-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      color: #fff;
    }

    .rating-row svg {
      color: var(--yellow-star);
      fill: var(--yellow-star);
    }

    .rating-row span { color: var(--text-dim); }

    .price-pill-box {
      background-color: var(--bg-pill-price);
      border-radius: 10px;
      padding: 8px 14px;
      margin: 4px 0;
    }

    .price-label {
      font-size: 9.5px;
      letter-spacing: 0.6px;
      color: var(--text-dim);
      text-transform: uppercase;
      font-weight: 700;
    }

    .price-value {
      font-size: 14.5px;
      font-weight: 800;
      color: #fff;
      margin-top: 2px;
    }

    .card-action-bar {
      display: flex;
      gap: 6px;
      margin-top: 6px;
    }

    .btn-card-lead {
      background-color: var(--btn-blue);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      flex: 1;
    }

    .btn-card-save {
      background-color: transparent;
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 12px;
      color: #fff;
      cursor: pointer;
    }

    .btn-icon-square {
      background-color: transparent;
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      text-decoration: none;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-icon-square:hover {
      color: #fff;
      border-color: var(--btn-blue);
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- Tela de Login com Conta Google -->
  <div id="authOverlay">
    <div class="auth-box">
      <div class="auth-logo">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#1767FF" stroke-width="2.5"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="5"></line><line x1="12" y1="19" x2="12" y2="23"></line><line x1="1" y1="12" x2="5" y2="12"></line><line x1="19" y1="12" x2="23" y2="12"></line></svg>
      </div>
      <h2>Lead Finder Pro</h2>
      <p>Acesse seu painel e encontre dezenas de empresas locais prontas para comprar um site profissional.</p>
      
      <button id="btnLoginGoogle" class="btn-google">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
        Entrar com o Google
      </button>
    </div>
  </div>

  <!-- Painel SaaS Principal -->
  <div class="app-layout">
    <aside class="sidebar">
      <div class="brand-header">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#1767FF" stroke-width="2.2"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="5"></line><line x1="12" y1="19" x2="12" y2="23"></line><line x1="1" y1="12" x2="5" y2="12"></line><line x1="19" y1="12" x2="23" y2="12"></line></svg>
        <div class="brand-info">
          <h2>Lead Finder</h2>
          <span>Encontre + clientes</span>
        </div>
      </div>

      <nav class="nav-links">
        <button class="nav-btn active">Buscar Leads</button>
        <button class="nav-btn" id="btnExportCSV">Exportar Leads (CSV)</button>
      </nav>

      <div class="filters-panel">
        <div class="filters-header"><span>Filtros</span></div>
        <div class="input-field">
          <label>Nicho</label>
          <input type="text" id="filterNiche" value="Barbearia">
        </div>
        <div class="input-field">
          <label>Cidade</label>
          <input type="text" id="filterCity" value="Macacá, RJ">
        </div>
        <div class="toggle-row">
          <span>Apenas sem site</span>
          <label class="switch"><input type="checkbox" id="filterNoWebsite" checked><span class="track"></span></label>
        </div>
        <div class="toggle-row">
          <span>Com WhatsApp</span>
          <label class="switch"><input type="checkbox" id="filterHasPhone" checked><span class="track"></span></label>
        </div>
        <button id="btnSearch" class="btn-search-glow">Buscar</button>
      </div>

      <div class="user-footer">
        <div class="user-pill">
          <img id="userPhoto" src="https://via.placeholder.com/32" class="user-avatar" alt="Avatar">
          <span id="userName" class="user-name">Usuário</span>
        </div>
        <button id="btnLogout" class="btn-logout" title="Sair">&#x21AA;</button>
      </div>
    </aside>

    <main class="content-area">
      <header class="navbar-top">
        <div class="search-input-pill">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#7E9AC3" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="text" id="topSearchInput" value="barbearia em macacá, rj">
          <button id="btnTopSubmit" class="btn-top-submit">Buscar</button>
        </div>
        <div class="badge-leads-count">Leads: <strong id="topCount">0</strong></div>
      </header>

      <section class="main-body">
        <div class="results-meta-bar">
          <span class="count-display"><strong id="resultsCount">0</strong> resultados encontrados</span>
          <div class="sort-dropdown">
            <select id="selectSort">
              <option value="rating">Ordenar por: Melhor avaliação</option>
              <option value="name">Ordenar por: Nome A-Z</option>
            </select>
          </div>
        </div>

        <div id="leadsGrid" class="cards-grid"></div>
      </section>
    </main>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
